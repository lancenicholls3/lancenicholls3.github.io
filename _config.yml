title: "Lance Nicholls"
description: "Mechanical Engineering • Biomechanics • Human-Centered Design"
url: "https://lancenicholls3.github.io"
baseurl: ""

theme: null
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: default

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:title/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "main"

  - scope:
      path: ""
    values:
      layout: single
      author_profile: false

author:
  name: "Lance Nicholls"
  links:
    - label: "GitHub"
      url: "https://github.com/lancenicholls3"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/lance-nicholls-0421561b4/"

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
# Build settings
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-archives

